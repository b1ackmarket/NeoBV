name: Alpha Build Manually (Without signature)

on:
  workflow_dispatch:
    inputs:
      google_services_json:
        description: "google-services.json (optional)"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-alpha:

    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Write google-services.json
        env:
          DATA: ${{ github.event.inputs.google_services_json }}
        run: |
          if [ -n "$DATA" ]; then
            printf '%s' "$DATA" > app/google-services.json
          else
            echo "google_services_json input is empty; building without Firebase."
          fi

      - name: Validate google-services.json
        run: node .github/scripts/validate-google-services.js

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build apk
        run: ./gradlew assembleDefaultAlpha assembleDefaultDebug

      - name: Parse apk infos
        id: apk-infos
        run: |
          alpha_meta=app/build/outputs/apk/default/alpha/output-metadata.json
          alpha_debug_meta=app/build/outputs/apk/default/debug/output-metadata.json
          echo "alpha_info_version_code=$(jq -r '.elements[0].versionCode' "$alpha_meta")" >> "$GITHUB_ENV"
          echo "alpha_info_version_name=$(jq -r '.elements[0].versionName' "$alpha_meta")" >> "$GITHUB_ENV"
          echo "alpha_debug_info_version_code=$(jq -r '.elements[0].versionCode' "$alpha_debug_meta")" >> "$GITHUB_ENV"
          echo "alpha_debug_info_version_name=$(jq -r '.elements[0].versionName' "$alpha_debug_meta")" >> "$GITHUB_ENV"

      # upload artifacts default-debug

      - name: Archive default debug build artifacts (universal)
        uses: actions/upload-artifact@v7
        with:
          name: Default debug build artifact (universal)
          path: app/build/outputs/apk/default/debug/NeoBV_${{ env.alpha_debug_info_version_code }}_${{ env.alpha_debug_info_version_name }}_default_universal.apk

      # upload artifacts default-alpha

      - name: Archive default alpha build mappings
        uses: actions/upload-artifact@v7
        with:
          name: Default alpha build mappings
          path: app/build/outputs/mapping/defaultAlpha

      - name: Archive default alpha build artifacts (universal)
        uses: actions/upload-artifact@v7
        with:
          name: Default alpha build artifact (universal)
          path: app/build/outputs/apk/default/alpha/NeoBV_${{ env.alpha_info_version_code }}_${{ env.alpha_info_version_name }}_default_universal.apk
