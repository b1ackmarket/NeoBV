name: Release Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    name: Build Release Apk
    runs-on: macos-latest
    if: github.repository == 'b1ackmarket/NeoBV'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Write google-services.json
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$DATA" ]; then
            printf '%s' "$DATA" > app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON is empty; building without Firebase."
          fi

      - name: Validate google-services.json
        run: node .github/scripts/validate-google-services.js

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Add signing properties
        env:
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
        run: |
          printf '%s' "$SIGNING_PROPERTIES" | base64 -D > signing.properties
          perl -0pi -e 's#^releaseStoreFile=.*$#releaseStoreFile=key.jks#m; s#^debugStoreFile=.*$#debugStoreFile=key.jks#m' signing.properties

      - name: Add jks file
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          printf '%s' "$SIGN_KEY" | base64 -D > key.jks

      - name: Verify signing key
        run: |
          KEYSTORE_PASSWORD="$(sed -n 's/^releaseStorePassword=//p' signing.properties | head -n1)"
          keytool -list -keystore key.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Build apk
        run: ./gradlew assembleDefaultRelease assembleDefaultDebug

      - name: Parse apk infos
        id: apk-infos
        run: |
          release_meta=app/build/outputs/apk/default/release/output-metadata.json
          release_debug_meta=app/build/outputs/apk/default/debug/output-metadata.json
          echo "release_info_version_code=$(jq -r '.elements[0].versionCode' "$release_meta")" >> "$GITHUB_ENV"
          echo "release_info_version_name=$(jq -r '.elements[0].versionName' "$release_meta")" >> "$GITHUB_ENV"
          echo "release_debug_info_version_code=$(jq -r '.elements[0].versionCode' "$release_debug_meta")" >> "$GITHUB_ENV"
          echo "release_debug_info_version_name=$(jq -r '.elements[0].versionName' "$release_debug_meta")" >> "$GITHUB_ENV"

      - name: Get changelog
        id: changelog
        run: |
          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(
            git tag --list 'v[0-9]*' --sort=-creatordate |
            grep -v -x "$current_tag" |
            while IFS= read -r tag; do
              if git merge-base --is-ancestor "$tag" "$current_tag"; then
                printf '%s\n' "$tag"
                break
              fi
            done
          )"
          if [ -n "$previous_tag" ]; then
            changelog_range="$previous_tag..$current_tag"
            changelog_title="Changes since $previous_tag"
          else
            changelog_range="$current_tag"
            changelog_title="Changes in $current_tag"
          fi
          {
            echo "changelog<<EOF"
            echo "## $changelog_title"
            echo
            git log --pretty=format:"- %s (%h)" "$changelog_range"
            echo
            echo "EOF"
          } >> "$GITHUB_ENV"

      # upload artifacts release debug

      - name: Archive release debug build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Release debug build artifact
          path: app/build/outputs/apk/default/debug/NeoBV_${{ env.release_debug_info_version_code }}_${{ env.release_debug_info_version_name }}_default_universal.apk

      # upload artifacts release

      - name: Archive release build mappings
        uses: actions/upload-artifact@v7
        with:
          name: Release build mappings
          path: app/build/outputs/mapping/defaultRelease

      - name: Archive release build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Release build artifact
          path: app/build/outputs/apk/default/release/NeoBV_${{ env.release_info_version_code }}_${{ env.release_info_version_name }}_default_universal.apk

      # zip mapping because softprops/action-gh-release can't upload folder

      - name: Zip mapping
        run: zip -rj mapping.zip app/build/outputs/mapping/defaultRelease

      # upload to github release

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/default/debug/NeoBV_${{ env.release_debug_info_version_code }}_${{ env.release_debug_info_version_name }}_default_universal.apk
            app/build/outputs/apk/default/release/NeoBV_${{ env.release_info_version_code }}_${{ env.release_info_version_name }}_default_universal.apk
            mapping.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ env.release_info_version_name }}
          prerelease: false
          body: ${{ env.changelog }}
          target_commitish: ${{ github.sha }}
